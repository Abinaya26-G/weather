<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Report</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter any city">
            <button><img src="search.jpg"></button>
        </div>
        <div class="weather">
            <img src="sunnny.webp" class="weathericon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="humidity.webp">
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>

                <div class="coll">
                    <img src="storm.webp">
                    <div>
                        <p class="wind">20 km/h</p>
                        <p>windy speed</p>
                    </div>
                </div>
            </div>
            
        </div>

    </div>


    <script>
        const apikey="5cf8a66bc253bfeaef936938c3949351";
        const apiurl="https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchbox=document.querySelector(".search input");
        const searchbtn=document.querySelector(".search button");

        async function checkwhether(city) {                  // funtion maathiri async function athu wait pannum data kuu...

            const response=await fetch(apiurl+city+`&appid=${apikey}`);     //wait for apiurl la fetch panna...
            var data=await response.json();

            console.log(data);

            document.querySelector(".city").innerHTML=data.name;
            document.querySelector(".temp").innerHTML=data.main.temp+"°C";
            document.querySelector(".humidity").innerHTML=data.main.humidity+"%";
            document.querySelector(".wind").innerHTML=data.wind.speed +"km/h";

            
        }

        searchbtn.addEventListener("click",()=>{

            checkwhether(searchbox.value);       //calling function...

        })

        

    </script>
</body>
</html>
